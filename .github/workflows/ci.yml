name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Build the upstream warehouse and semantic manifest
        run: python scripts/bootstrap_warehouse.py --scale 1.0
      - name: Tests (scoring, compiler vs every gold answer)
        run: pytest -q
      - name: Replay the published run (no model needed) and check the scores reproduce
        run: |
          cp results/benchmark_report.md /tmp/published_report.md
          python scripts/run_benchmark.py --backend replay
          diff <(sed -n '/Correct answers/,/after one retry/p' /tmp/published_report.md) \
               <(sed -n '/Correct answers/,/after one retry/p' results/benchmark_report.md)
